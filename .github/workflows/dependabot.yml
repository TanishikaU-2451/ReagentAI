name: Dependabot Automated Updates

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6 AM UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    - name: Update Python dependencies
      run: |
        pip install --upgrade pip
        pip install pip-tools
        pip-compile --upgrade requirements.in || pip freeze > requirements.txt

    - name: Update Node.js dependencies
      working-directory: frontend/nextjs_app
      run: |
        npm update
        npm audit fix --force || true

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update dependencies"
        title: "🔄 Automated Dependency Updates"
        body: |
          ## Automated Dependency Updates

          This PR contains automated updates to project dependencies:

          - Python packages updated to latest compatible versions
          - Node.js packages updated with security fixes applied
          - Generated by dependabot-style automation

          Please review changes before merging.
        branch: updates/dependencies